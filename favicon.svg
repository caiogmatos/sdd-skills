<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- antenna -->
  <line x1="16" y1="4.5" x2="16" y2="8" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="3.5" r="2.5" fill="#facc15"/>
  <!-- ears -->
  <rect x="1.5" y="13" width="3" height="8" rx="1.5" fill="#00e5ff"/>
  <rect x="27.5" y="13" width="3" height="8" rx="1.5" fill="#00e5ff"/>
  <!-- head -->
  <rect x="5" y="8.5" width="22" height="18" rx="5" fill="#0e1117" stroke="#00e5ff" stroke-width="2.2"/>
  <!-- eyes -->
  <circle cx="11.5" cy="16" r="2.8" fill="#34d399"/>
  <circle cx="20.5" cy="16" r="2.8" fill="#34d399"/>
  <!-- mouth -->
  <rect x="11" y="21" width="10" height="2.2" rx="1.1" fill="#a78bfa"/>
